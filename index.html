<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機械工藝聯盟</title>
<style>
  :root{--bg:#14110f;--card:#1f1a16;--text:#e9e1d6;--gold:#c8923c;--copper:#b8652e;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.8}
  header{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;
    background:linear-gradient(rgba(20,17,15,.65),rgba(20,17,15,.95)),url("photo4.jpg") center/cover}
  header h1{font-size:clamp(2.2rem,8vw,4.5rem);letter-spacing:.2em;color:var(--gold)}
  header p{margin-top:16px;font-size:1.1rem;max-width:560px}
  .btn{display:inline-block;margin-top:28px;padding:12px 32px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;border-radius:4px;transition:.3s}
  .btn:hover{background:var(--gold);color:#14110f}
  section{max-width:1000px;margin:0 auto;padding:64px 20px}
  h2{color:var(--gold);font-size:1.8rem;margin-bottom:20px;border-left:4px solid var(--copper);padding-left:14px}
  .about p{margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .card{background:var(--card);border-radius:8px;overflow:hidden;border:1px solid #33291f}
  .card img{width:100%;height:220px;object-fit:cover;display:block;transition:transform .4s}
  .card:hover img{transform:scale(1.05)}
  .card div{padding:16px}
  .card h3{color:var(--gold);margin-bottom:6px}
  .feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .feat div{background:var(--card);padding:20px;border-radius:8px;border-top:3px solid var(--copper)}
  .feat h3{margin-bottom:6px}
  footer{text-align:center;padding:32px;color:#8a7f72;border-top:1px solid #33291f}
</style>
</head>
<body>


<header>
  <h1>機械工藝聯盟</h1>
  <p>用雙手與金屬，打造有靈魂的機械之美</p>
  <a class="btn" href="#about">認識我們</a>
</header>


<section id="about" class="about">
  <h2>關於聯盟</h2>
  <p>【在這裡寫聯盟的介紹：成立時間、成立宗旨、成員有哪些人】</p>
  <p>【可以再補充：聯盟想傳達的理念、舉辦過的活動】</p>
</section>


<section>
  <h2>我們在做什麼</h2>
  <div class="feat">
    <div><h3>⚙️ 機械設計</h3><p>【簡短說明】</p></div>
    <div><h3>🔥 金工焊接</h3><p>【簡短說明】</p></div>
    <div><h3>🛠 手作創作</h3><p>【簡短說明】</p></div>
    <div><h3>🏭 空間展演</h3><p>【簡短說明】</p></div>
  </div>
</section>


<section>
  <h2>作品與空間</h2>
  <div class="grid">
    <div class="card"><img src="photo1.jpg" alt="機械造型義式咖啡機"><div><h3>機械咖啡機</h3><p>【作品說明】</p></div></div>
    <div class="card"><img src="photo2.jpg" alt="蒸汽龐克風機械模型"><div><h3>蒸汽龐克模型</h3><p>【作品說明】</p></div></div>
    <div class="card"><img src="photo3.jpg" alt="焊接工作中"><div><h3>焊接工藝</h3><p>【作品說明】</p></div></div>
    <div class="card"><img src="photo4.jpg" alt="工業風工坊空間"><div><h3>工坊空間</h3><p>【空間說明】</p></div></div>
  </div>
</section>


<footer>© 2026 機械工藝聯盟</footer>


</body>
</html>
